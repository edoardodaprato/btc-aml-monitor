[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-aml-monitor"
version = "0.8.1"
description = "Retrospective Bitcoin transaction monitoring for AML compliance: OFAC screening, FATF red-flag rules, multi-hop exposure and explainable risk scoring."
readme = "README.md"
license = "MIT"
authors = [{ name = "Edoardo Daprato" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
btc-aml = "btc_aml.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
